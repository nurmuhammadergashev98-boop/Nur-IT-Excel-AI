<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nur IT Excel AI Pro</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .header { background: linear-gradient(135deg, #217346 0%, #1a5c38 100%); color: white; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header h2 { margin: 0; font-size: 18px; text-transform: uppercase; }
        .content { padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        textarea { width: 100%; border: 1px solid #ced4da; border-radius: 6px; padding: 12px; font-size: 14px; resize: none; box-sizing: border-box; }
        .btn-primary { background-color: #217346; color: white; border: none; border-radius: 6px; padding: 12px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-primary:hover { background-color: #1a5c38; transform: translateY(-1px); }
        .loader { display: none; text-align: center; margin-top: 20px; color: #217346; }
        .result-area { margin-top: 20px; display: none; }
        .result-box { background: #f1f8f4; border-left: 5px solid #217346; padding: 15px; border-radius: 6px; font-size: 14px; color: #333; line-height: 1.5; white-space: pre-wrap; }
        .footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 11px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h2>NUR IT | AI PRO</h2>
    </div>
    <div class="content">
        <div class="card">
            <label style="font-weight: 600; margin-bottom: 10px; display: block;">Vazifani yozing:</label>
            <textarea id="prompt" rows="5" placeholder="Masalan: A1 va B1 kataklarini qo'shish uchun formula yoz..."></textarea>
            <button id="run" class="btn-primary">AI GA YUBORISH</button>
        </div>

        <div id="loader" class="loader">
            <img src="https://static2.sharepointonline.com/files/fabric/assets/loader/loader-40x40.gif" width="30" /><br>
            <span>Groq AI o'ylamoqda...</span>
        </div>

        <div id="result-area" class="result-area">
            <label style="font-weight: 600;">AI Javobi:</label>
            <div id="status" class="result-box"></div>
        </div>
    </div>
    <div class="footer">Powered by Groq Cloud | Nurmuhammad AI</div>
    <script src="taskpane.js" type="text/javascript"></script>
</body>
</html>
